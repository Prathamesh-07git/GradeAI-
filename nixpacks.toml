[phases.setup]
nixPkgs = ["python310"]

[phases.install]
cmds = [
  "pip install torch --index-url https://download.pytorch.org/whl/cpu",
  "pip install -r backend/requirements.txt"
]

[phases.build]
cmds = [
  "python nlp/setup_models.py"
]

[start]
cmd = "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
