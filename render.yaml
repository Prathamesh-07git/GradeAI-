services:
  - type: web
    name: gradeai-backend
    env: python
    buildCommand: "pip install torch --index-url https://download.pytorch.org/whl/cpu && pip install -r backend/requirements.txt && python backend/setup_models.py"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: "/health"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: CORS_ORIGINS
        value: "*"
      - key: PYTHONPATH
        value: "."
      - key: SECRET_KEY
        generateValue: true
