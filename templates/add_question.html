{% extends "base.html" %}

{% block content %}
<div class="form-container" style="max-width: 800px; margin: 2rem auto; padding: 2rem; background: var(--white); border-radius: 0.5rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);">
    <h2 style="color: var(--primary-color); margin-bottom: 0.5rem;">Add Question</h2>
    <p style="color: var(--text-light); margin-bottom: 1.5rem;">Adding to Exam: <strong>{{ exam['title'] }}</strong></p>
    
    <form method="post">
        <div class="form-group" style="margin-bottom: 1rem;">
            <label for="question_text" style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Question Text</label>
            <textarea id="question_text" name="question_text" required rows="2" style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 0.375rem; font-family: inherit;"></textarea>
        </div>
        <div class="form-group" style="margin-bottom: 1rem;">
            <label for="reference_answer" style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Model / Reference Answer</label>
            <p style="font-size: 0.85rem; color: var(--text-light); margin-bottom: 0.5rem;">Provide an ideal answer. The NLP engine uses this to calculate similarity.</p>
            <textarea id="reference_answer" name="reference_answer" required rows="4" style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 0.375rem; font-family: inherit;"></textarea>
        </div>
        <div style="display: flex; gap: 1rem; margin-bottom: 1rem;">
            <div class="form-group" style="flex: 1;">
                <label for="keywords" style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Important Keywords</label>
                <input type="text" id="keywords" name="keywords" placeholder="e.g. data, method, class" style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 0.375rem;">
                <p style="font-size: 0.8rem; color: var(--text-light); margin-top: 0.25rem;">Comma separated</p>
            </div>
            <div class="form-group" style="flex: 1;">
                <label for="concepts" style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Important Concepts</label>
                <input type="text" id="concepts" name="concepts" placeholder="e.g. Data hiding, Overriding" style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 0.375rem;">
                <p style="font-size: 0.8rem; color: var(--text-light); margin-top: 0.25rem;">Comma separated</p>
            </div>
        </div>
        <div class="form-group" style="margin-bottom: 1.5rem;">
            <label for="maximum_marks" style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Maximum Marks</label>
            <input type="number" id="maximum_marks" name="maximum_marks" required min="1" style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 0.375rem;">
        </div>
        <div style="display: flex; gap: 1rem;">
            <button type="submit" class="btn btn-primary" style="flex: 1;">Save Question</button>
            <a href="{{ url_for('teacher.dashboard') }}" class="btn btn-secondary" style="text-align: center; flex: 1;">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
