{% extends "base.html" %}

{% block content %}
<div class="form-container" style="max-width: 600px; margin: 2rem auto; padding: 2rem; background: var(--white); border-radius: 0.5rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);">
    <h2 style="color: var(--primary-color); margin-bottom: 1.5rem;">Create New Exam</h2>
    <form method="post">
        <div class="form-group" style="margin-bottom: 1rem;">
            <label for="title" style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Exam Title</label>
            <input type="text" id="title" name="title" required style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 0.375rem;">
        </div>
        <div class="form-group" style="margin-bottom: 1rem;">
            <label for="description" style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Description (Optional)</label>
            <textarea id="description" name="description" rows="3" style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 0.375rem; font-family: inherit;"></textarea>
        </div>
        <div class="form-group" style="margin-bottom: 1.5rem;">
            <label for="total_marks" style="display: block; margin-bottom: 0.5rem; font-weight: 500;">Total Marks</label>
            <input type="number" id="total_marks" name="total_marks" required min="1" style="width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 0.375rem;">
        </div>
        <div style="display: flex; gap: 1rem;">
            <button type="submit" class="btn btn-primary" style="flex: 1;">Create Exam</button>
            <a href="{{ url_for('teacher.dashboard') }}" class="btn btn-secondary" style="text-align: center; flex: 1;">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
